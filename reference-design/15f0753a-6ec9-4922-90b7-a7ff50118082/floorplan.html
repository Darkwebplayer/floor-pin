<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FloorPin — Floor Plan</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  .main { height: 100vh; height: 100dvh; overflow: hidden; }
  .fp-content { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 372px; }

  /* ── Viewer ── */
  .viewer-wrap { position: relative; min-width: 0; background: var(--surface-warm); overflow: hidden; }
  .viewer { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none;
    background-image: radial-gradient(circle, color-mix(in oklab,var(--fg),transparent 92%) 1px, transparent 1px);
    background-size: 26px 26px; }
  .viewer.panning { cursor: grabbing; }
  .stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  .plan-img { display: block; width: auto; height: auto; max-width: none; user-select: none; -webkit-user-drag: none;
    border-radius: var(--radius-sm); box-shadow: var(--elev-raised); background: #fff; }

  /* pins live INSIDE the stage → locked to the same plan coordinate at any zoom */
  .pin { position: absolute; transform: translate(-50%, -100%); }
  .stage.pins-hidden .pin, .stage.pins-hidden .dpin { display: none; }
  .viewer.move-mode .pin .mark, .viewer.move-mode .dpin .ddot { cursor: move; }
  /* defect markers — small status dots, anchored to their own plan coordinate */
  .dpin { position: absolute; transform: translate(-50%, -50%); z-index: 1; }
  .dpin .ddot { transform: scale(var(--inv,1)); transform-origin: center; width: 17px; height: 17px; border-radius: 50%;
    border: 2.5px solid #fff; box-shadow: 0 2px 5px rgba(3,3,39,.34); cursor: pointer; transition: transform var(--motion-fast) var(--ease-standard); }
  .dpin .ddot:hover { transform: scale(calc(var(--inv,1) * 1.3)); }
  .dpin.sel .ddot { box-shadow: 0 0 0 3px color-mix(in oklab,var(--accent),transparent 55%), 0 2px 5px rgba(3,3,39,.34); }
  .dpin .tag { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%) scale(var(--inv,1));
    transform-origin: 50% 100%; background: var(--fg); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: var(--radius-sm);
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity var(--motion-fast); z-index: 3; }
  .dpin .ddot:hover + .tag, .dpin.sel .tag { opacity: 1; }
  .pin .mark { position: relative; transform: scale(var(--inv,1)); transform-origin: 50% 100%;
    cursor: pointer; filter: drop-shadow(0 4px 6px rgba(3,3,39,.28)); transition: transform var(--motion-fast) var(--ease-standard); }
  .pin .mark:hover { transform: scale(calc(var(--inv,1) * 1.12)); }
  .pin .mark svg { width: 30px; height: 38px; display: block; }
  .pin .count { position: absolute; top: -7px; right: -9px; min-width: 18px; height: 18px; padding: 0 4px;
    border-radius: var(--radius-pill); background: #fff; color: var(--fg); font-size: 11px; font-weight: 400;
    display: grid; place-items: center; box-shadow: var(--elev-ring); font-feature-settings:"tnum"; }
  .pin.selected .mark { transform: scale(calc(var(--inv,1) * 1.18)); }
  .pin.selected .mark::after { content:""; position: absolute; left: 50%; bottom: -4px; width: 30px; height: 10px;
    transform: translateX(-50%); border-radius: 50%; background: color-mix(in oklab,var(--accent),transparent 65%); }
  .pin .tag { position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%) scale(var(--inv,1));
    transform-origin: 50% 100%; background: var(--fg); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: var(--radius-sm);
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity var(--motion-fast); }
  .pin .mark:hover + .tag, .pin.selected .tag { opacity: 1; }

  /* ── Top-left plan name pill ── */
  .plan-name { position: absolute; top: var(--space-4); left: var(--space-4); z-index: 6;
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--elev-ambient);
    padding: 7px 14px; font-size: var(--text-sm); color: var(--fg); display: flex; align-items: center; gap: 8px; }
  .plan-name .dotlive { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
  .plan-name { cursor: pointer; font-family: inherit; }
  .plan-name:hover { background: var(--surface-warm); }
  .plan-name .chev { width: 14px; height: 14px; color: var(--muted); margin-left: 2px; }
  .plan-menu { position: absolute; top: calc(var(--space-4) + 46px); left: var(--space-4); z-index: 8; width: 300px;
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--elev-raised); padding: 6px; display: none; }
  .plan-menu.show { display: block; }
  .pm-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer;
    width: 100%; text-align: left; border: none; background: none; font: inherit; color: var(--fg-2); }
  .pm-item:hover { background: var(--surface-warm); }
  .pm-item.active { background: color-mix(in oklab,var(--accent),transparent 92%); }
  .pm-item img { width: 42px; height: 32px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); flex: none; }
  .pm-item .nm { color: var(--fg); font-size: var(--text-sm); line-height: 1.25; }
  .pm-item .mt { font-size: var(--text-xs); color: var(--muted); font-feature-settings:"tnum"; }
  .pm-foot { display: flex; gap: 6px; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; }
  .pm-foot a { flex: 1; text-align: center; font-size: var(--text-xs); padding: 9px; border-radius: var(--radius-sm); color: var(--accent); }
  .pm-foot a:hover { background: var(--surface-warm); }
  .mode-chip { position: absolute; top: var(--space-4); left: 50%; transform: translateX(-50%); z-index: 6;
    background: var(--fg); color: #fff; border-radius: var(--radius-pill); padding: 6px 14px; font-size: var(--text-xs);
    display: none; align-items: center; gap: 8px; box-shadow: var(--elev-ambient); }
  .mode-chip.show { display: inline-flex; }
  .mode-chip .k { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

  /* ── Right-side icon toolbar ── */
  .fp-tools { position: absolute; top: var(--space-4); right: var(--space-4); z-index: 7; display: flex; flex-direction: column; gap: 4px;
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 6px; box-shadow: var(--elev-ambient); }
  .fp-tools button { width: 44px; height: 44px; border: none; background: #fff; border-radius: var(--radius-sm); color: var(--fg-2);
    cursor: pointer; display: grid; place-items: center; transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast); }
  .fp-tools button svg { width: 21px; height: 21px; }
  .fp-tools button:hover { background: var(--surface-warm); color: var(--fg); }
  .fp-tools button.on { background: var(--accent); color: #fff; }
  .fp-tools .tdiv { height: 1px; background: var(--border); margin: 3px 5px; }

  /* ── Search panel (anchored left of the toolbar) ── */
  .fp-search { position: absolute; top: var(--space-4); right: 78px; z-index: 7; width: 268px;
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--elev-raised);
    padding: 8px; display: none; }
  .fp-search.show { display: block; }
  .fp-search input { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px;
    font-family: inherit; font-size: var(--text-sm); color: var(--fg); min-height: 40px; }
  .fp-search input:focus-visible { border-color: var(--accent); box-shadow: var(--focus-ring); }
  .sresults { margin-top: 6px; max-height: 240px; overflow-y: auto; }
  .sresult { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-sm); color: var(--fg-2); }
  .sresult:hover { background: var(--surface-warm); }
  .sresult .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .sresult .ct { margin-left: auto; font-size: var(--text-xs); color: var(--muted); font-feature-settings:"tnum"; }
  .sresult .nm { color: var(--fg); }
  .sempty { padding: 12px 10px; color: var(--muted); font-size: var(--text-sm); }

  /* ── Zoom controls (bottom-right) ── */
  .zoomctl { position: absolute; bottom: var(--space-4); right: var(--space-4); z-index: 6; display: flex; flex-direction: column;
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--elev-ambient); overflow: hidden; }
  .zoomctl button { width: 44px; height: 44px; border: none; background: #fff; color: var(--fg); cursor: pointer; display: grid; place-items: center; font-size: 18px; }
  .zoomctl button + button { border-top: 1px solid var(--border); }
  .zoomctl button:hover { background: var(--surface-warm); }
  .zoomctl .zlevel { font-size: 11px; color: var(--muted); height: 30px; font-feature-settings:"tnum"; border-top: 1px solid var(--border); display: grid; place-items: center; }

  .legend { position: absolute; bottom: var(--space-4); left: var(--space-4); z-index: 6; background: #fff; border: 1px solid var(--border);
    border-radius: var(--radius-md); box-shadow: var(--elev-ambient); padding: 10px 14px; display: flex; gap: var(--space-4); font-size: var(--text-xs); color: var(--fg-2); }
  .legend i { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; }

  .hint { position: absolute; bottom: 78px; left: 50%; transform: translateX(-50%); z-index: 6; pointer-events: none;
    background: color-mix(in oklab,var(--fg),transparent 6%); color: #fff; padding: 9px 16px; border-radius: var(--radius-pill);
    font-size: var(--text-sm); opacity: 0; transition: opacity var(--motion-base); white-space: nowrap; }
  .hint.show { opacity: 1; }

  /* ── Inspector ── */
  .inspector { border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
  .insp-head { padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--border); }
  .insp-head .eyebrow { display:block; margin-bottom: 4px; }
  .insp-head h2 { font-size: var(--text-2xl); }
  .insp-body { flex: 1; overflow-y: auto; padding: var(--space-5) var(--space-6); }
  .insp-empty { color: var(--muted); font-size: var(--text-sm); text-align: center; padding: var(--space-12) var(--space-4); }
  .insp-empty svg { width: 40px; height: 40px; color: var(--border); margin-bottom: var(--space-3); }

  .defect { border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-3); }
  .defect { cursor: pointer; transition: border-color var(--motion-fast) var(--ease-standard); }
  .defect:hover { border-color: #b9b9f9; }
  .defect .d-top { display: flex; justify-content: space-between; gap: var(--space-3); align-items: flex-start; }
  .defect h4 { font-family: var(--font-display); font-weight: 400; font-size: var(--text-base); color: var(--fg); }
  .defect p { font-size: var(--text-sm); color: var(--muted); margin: 6px 0 0; }
  .defect .d-foot { display: flex; align-items: center; gap: var(--space-3); margin-top: 10px; }
  .defect .d-foot .date { font-size: var(--text-xs); color: var(--muted); font-feature-settings:"tnum"; }
  .defect img.shot { width: 100%; height: 132px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-top: 10px; }
  .defect select.statussel { font-size: var(--text-xs); padding: 3px 6px; min-height: 28px; width: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); background:#fff; color: var(--fg-2); }

  .photo-drop { border: 1px dashed #362baa; border-radius: var(--radius-sm); padding: var(--space-3); text-align: center; color: var(--accent);
    font-size: var(--text-sm); cursor: pointer; background: color-mix(in oklab,var(--accent),transparent 96%); display:flex; align-items:center; justify-content:center; gap:8px; }
  .photo-drop svg { width: 18px; height: 18px; }
  .photo-prev { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .photo-prev img { width: 56px; height: 56px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); }

  .loc-rename { display: flex; gap: 8px; margin-top: var(--space-3); }
  .loc-rename input { flex: 1; }

  .insp-close { position: absolute; top: 14px; right: 16px; width: 36px; height: 36px; border: 1px solid var(--border);
    background: #fff; border-radius: var(--radius-sm); cursor: pointer; display: none; place-items: center; color: var(--fg-2); }
  .insp-head { position: relative; }

  /* ── Tablet + mobile: inspector becomes a slide-up bottom sheet ── */
  @media (max-width: 980px){
    .fp-content { grid-template-columns: 1fr; }
    .inspector {
      position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); z-index: 40;
      max-height: 80vh; max-height: min(80dvh, calc(100dvh - var(--kb, 0px) - 16px)); border-left: none; border-top: 1px solid var(--border);
      border-radius: 18px 18px 0 0; box-shadow: 0 -14px 44px rgba(3,3,39,.24);
      transform: translateY(102%); transition: transform var(--motion-base) var(--ease-standard);
    }
    .inspector.open { transform: translateY(0); }
    .inspector::before { content:""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 42px; height: 4px; border-radius: 99px; background: var(--border); z-index: 2; }
    .insp-head { padding-top: 22px; }
    .insp-close { display: grid; }
    .insp-body { padding-bottom: max(var(--space-6), env(safe-area-inset-bottom)); }
  }

  /* ── Phone: compact top bar, smaller chrome ── */
  @media (max-width: 600px){
    .topbar { padding: 10px 14px; gap: 8px; min-height: 58px; }
    .topbar .crumb { display: none; }
    .topbar .title { font-size: var(--text-lg); }
    #replaceBtn .lbl, .btn .lbl { display: none; }
    .fp-tools button, .zoomctl button { width: 40px; height: 40px; }
    .fp-search { right: 64px; width: min(248px, calc(100vw - 84px)); }
    .legend { gap: 10px; padding: 8px 10px; font-size: 10px; }
    .legend i:nth-child(n+3) { display: none; }
    .mode-chip { font-size: 10px; padding: 5px 10px; }
  }
</style>
</head>
<body data-page="plans">
<div class="app" data-shell>
  <main class="main">
    <header class="topbar">
      <div>
        <div class="crumb"><a href="plans.html">Floor Plans</a></div>
        <div class="title" id="planTitle">Floor plan</div>
      </div>
      <div class="grow"></div>
      <button class="btn btn-neutral" id="replaceBtn">
        <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0 4 4m-4-4-4 4M5 16v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="lbl">Replace plan</span>
      </button>
      <a class="btn btn-primary" href="report.html"><span class="lbl">Generate&nbsp;</span>report</a>
    </header>

    <div class="fp-content">
      <div class="viewer-wrap">
        <button class="plan-name" id="planSwitch" title="Switch floor plan"><span class="dotlive"></span><span id="planLabel">Floor plan</span><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <div class="plan-menu" id="planMenu"></div>
        <div class="mode-chip" id="modeChip"><span class="k"></span><span id="modeChipText"></span></div>

        <!-- right-side icon toolbar -->
        <div class="fp-tools" role="toolbar" aria-label="Map tools">
          <button data-tool="browse" class="on" title="Browse — zoom, pan, view defects">
            <svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0v4.5a5.5 5.5 0 0 1-5.5 5.5h-1.2a4 4 0 0 1-3-1.4l-3.2-3.8a1.5 1.5 0 0 1 2.2-2L9 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button data-tool="addloc" title="Add location — tap the plan to place a marker">
            <svg viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-11a7 7 0 0 0-9.3-6.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M5.3 6.2A7 7 0 0 0 5 10c0 4.7 7 11 7 11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M3.5 4.5h4M5.5 2.5v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
          <button data-tool="adddef" title="Add defect — tap a location pin">
            <svg viewBox="0 0 24 24"><path d="M11 4.2 3.3 17.8A1.5 1.5 0 0 0 4.6 20h10.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 10v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="11" cy="16" r="1" fill="currentColor"/><path d="M18 14v6M15 17h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button data-tool="move" title="Move — drag pins &amp; defects to reposition">
            <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-2.6 2.6M12 3l2.6 2.6M12 21l-2.6-2.6M12 21l2.6-2.6M3 12l2.6-2.6M3 12l2.6 2.6M21 12l-2.6-2.6M21 12l-2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="tdiv"></div>
          <button data-tool="hide" title="Show / hide pins">
            <svg viewBox="0 0 24 24" id="eyeIcon"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
          </button>
          <button data-tool="search" title="Search locations">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div class="fp-search" id="fpSearch">
          <input id="searchInp" placeholder="Search locations…" autocomplete="off">
          <div class="sresults" id="sResults"></div>
        </div>

        <div class="viewer" id="viewer">
          <div class="stage" id="stage">
            <img class="plan-img" id="planImg" src="assets/floor-plan.webp" alt="Floor plan" draggable="false">
            <!-- pins injected here -->
          </div>
        </div>

        <div class="hint" id="hint"></div>

        <div class="legend">
          <i><span class="sw" style="background:var(--accent)"></span> Location</i>
          <i><span class="sw" style="background:var(--st-open)"></span> Open</i>
          <i><span class="sw" style="background:var(--st-progress)"></span> In&nbsp;progress</i>
          <i><span class="sw" style="background:var(--st-resolved)"></span> Resolved</i>
        </div>

        <div class="zoomctl">
          <button id="zin" title="Zoom in">+</button>
          <button id="zout" title="Zoom out">−</button>
          <button id="zfit" title="Fit to screen"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          <div class="zlevel"><span id="zlevel">100%</span></div>
        </div>
      </div>

      <aside class="inspector">
        <div class="insp-head">
          <button class="insp-close" id="inspClose" aria-label="Close details">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <span class="eyebrow" id="inspKicker">Browse</span>
          <h2 id="inspTitle">Nothing selected</h2>
        </div>
        <div class="insp-body" id="inspBody"></div>
      </aside>
    </div>
  </main>
</div>

<input type="file" id="planFile" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="photoFile" accept="image/*" capture="environment" hidden multiple>

<script src="assets/shell.js"></script>
<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const SVG_PIN = c =>
    `<svg viewBox="0 0 24 30"><path d="M12 29s10-9.2 10-17A10 10 0 1 0 2 12c0 7.8 10 17 10 17Z" fill="${c}" stroke="#fff" stroke-width="1.4"/><circle cx="12" cy="12" r="3.6" fill="#fff"/></svg>`;

  // ── resolve the active plan from URL (?plan=) or last-opened, load its data from the shared store ──
  const FP = window.FloorPin;
  const plansList = FP.plans();
  const params = new URLSearchParams(location.search);
  const planId = (params.get("plan") && plansList.some(p => p.id === params.get("plan"))) ? params.get("plan") : FP.lastPlan();
  FP.setLastPlan(planId);
  const plan = FP.plan(planId) || plansList[0];

  let locations = FP.locations(planId);
  let selectedId = null;
  let selectedDefId = null;   // when a single defect is open
  let mode = "browse";        // 'browse' | 'addloc' | 'adddef'
  let substate = "pickLocation";  // adddef sub-step: 'pickLocation' → 'placePin'
  let pendingLocId = null;
  let pinsHidden = false;
  let nextId = 1000;

  function save(){ FP.saveLocations(planId, locations); }

  const viewer = $("#viewer"), stage = $("#stage"), planImg = $("#planImg");
  $("#planTitle").textContent = plan.name;
  $("#planLabel").textContent = plan.name;
  let scale = 1, tx = 0, ty = 0;
  function apply(){
    stage.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
    stage.style.setProperty("--inv", 1/scale);   // counter-scales pins → constant on-screen size
    $("#zlevel").textContent = Math.round(scale*100) + "%";
  }
  function fit(){
    const vw = viewer.clientWidth, vh = viewer.clientHeight;
    const iw = planImg.clientWidth || planImg.naturalWidth, ih = planImg.clientHeight || planImg.naturalHeight;
    if(!iw || !ih) return;
    const pad = 48;
    scale = Math.min((vw-pad)/iw, (vh-pad)/ih, 1.4);
    tx = (vw - iw*scale)/2; ty = (vh - ih*scale)/2;
    apply();
  }
  function zoomAt(cx, cy, factor){
    const ns = Math.min(Math.max(scale*factor, 0.3), 6);
    const k = ns/scale;
    tx = cx - (cx - tx)*k; ty = cy - (cy - ty)*k;
    scale = ns; apply();
  }
  function centerOn(loc){
    const iw = planImg.clientWidth, ih = planImg.clientHeight;
    const px = (loc.x/100)*iw, py = (loc.y/100)*ih;
    if(scale < 1.2){ scale = 1.4; }
    tx = viewer.clientWidth/2 - px*scale;
    ty = viewer.clientHeight/2 - py*scale;
    apply();
  }
  $("#zin").onclick = () => zoomAt(viewer.clientWidth/2, viewer.clientHeight/2, 1.25);
  $("#zout").onclick = () => zoomAt(viewer.clientWidth/2, viewer.clientHeight/2, 0.8);
  $("#zfit").onclick = fit;
  viewer.addEventListener("wheel", e => {
    e.preventDefault();
    const r = viewer.getBoundingClientRect();
    zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY < 0 ? 1.12 : 0.89);
  }, {passive:false});

  // ── pointer: pan / tap-to-add / select / drag-to-move ──
  let pointer = null;     // {x,y,tx,ty,kind,id,moved}
  const pointers = new Map();   // active touch points (for pinch)
  let pinch = null;
  const dist2 = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
  const mid2  = (a,b) => ({ x:(a.x+b.x)/2, y:(a.y+b.y)/2 });
  viewer.addEventListener("pointerdown", e => {
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(pointers.size === 2){                          // second finger → enter pinch, cancel single-touch
      pointer = null; viewer.classList.remove("panning");
      const p = [...pointers.values()];
      pinch = { dist: dist2(p[0], p[1]), mid: mid2(p[0], p[1]) };
      try { viewer.setPointerCapture(e.pointerId); } catch(_){}
      return;
    }
    if(pointers.size > 2) return;
    // defect-placement step: any click drops the pin (a drag still pans)
    if(mode === "adddef" && substate === "placePin"){
      pointer = { x:e.clientX, y:e.clientY, tx, ty, kind:"place", moved:false };
      viewer.classList.add("panning"); viewer.setPointerCapture(e.pointerId); return;
    }
    const dpinEl = e.target.closest(".dpin");
    if(dpinEl && !pinsHidden){
      e.stopPropagation();
      pointer = { x:e.clientX, y:e.clientY, kind:"dpin", id:+dpinEl.dataset.loc, did:+dpinEl.dataset.did, moved:false };
      if(mode === "browse") selectDefect(+dpinEl.dataset.loc, +dpinEl.dataset.did);   // click a defect dot → open that defect
      viewer.setPointerCapture(e.pointerId); return;
    }
    const pinEl = e.target.closest(".pin");
    if(pinEl && !pinsHidden){
      e.stopPropagation();
      const id = +pinEl.dataset.id;
      pointer = { x:e.clientX, y:e.clientY, kind: (mode==="adddef" ? "pinadd" : "pin"), id, moved:false };
      if(mode === "browse") selectLoc(id);     // single click → view its defects
      viewer.setPointerCapture(e.pointerId);
      return;
    }
    pointer = { x:e.clientX, y:e.clientY, tx, ty, kind:"pan", moved:false };
    viewer.classList.add("panning");
    viewer.setPointerCapture(e.pointerId);
  });
  viewer.addEventListener("pointermove", e => {
    if(pointers.has(e.pointerId)) pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(pinch && pointers.size >= 2){                  // two-finger pinch zoom + pan
      const p = [...pointers.values()];
      const nd = dist2(p[0], p[1]), nm = mid2(p[0], p[1]);
      const r = viewer.getBoundingClientRect();
      if(pinch.dist > 0) zoomAt(nm.x - r.left, nm.y - r.top, nd / pinch.dist);
      tx += nm.x - pinch.mid.x; ty += nm.y - pinch.mid.y; apply();
      pinch.dist = nd; pinch.mid = nm;
      return;
    }
    if(!pointer) return;
    const dx = e.clientX - pointer.x, dy = e.clientY - pointer.y;
    if(Math.abs(dx) > 4 || Math.abs(dy) > 4) pointer.moved = true;
    if(pointer.kind === "pin" && mode === "move" && pointer.moved){
      // drag to reposition a marker (Move mode only)
      const r = stage.getBoundingClientRect();
      const loc = locations.find(l => l.id === pointer.id);
      loc.x = clampPct((e.clientX - r.left)/r.width*100);
      loc.y = clampPct((e.clientY - r.top)/r.height*100);
      positionPin(pointer.id);
    } else if(pointer.kind === "dpin" && mode === "move" && pointer.moved){
      // drag to reposition a defect dot
      const r = stage.getBoundingClientRect();
      const loc = locations.find(l => l.id === pointer.id);
      const d = loc && loc.defects.find(x => x.id === pointer.did);
      if(d){ d.x = clampPct((e.clientX - r.left)/r.width*100); d.y = clampPct((e.clientY - r.top)/r.height*100); positionDefect(pointer.did); }
    } else if(pointer.kind === "pan" || pointer.kind === "place"){
      tx = pointer.tx + dx; ty = pointer.ty + dy; apply();
    }
  });
  viewer.addEventListener("pointerup", e => {
    pointers.delete(e.pointerId);
    if(pinch){ if(pointers.size < 2){ pinch = null; pointer = null; } viewer.classList.remove("panning"); return; }
    viewer.classList.remove("panning");
    if(!pointer){ return; }
    if(pointer.kind === "pin"){
      if(pointer.moved && mode === "move") save();        // finished a drag-move
    } else if(pointer.kind === "dpin"){
      if(pointer.moved && mode === "move") save();        // finished dragging a defect dot
    } else if(pointer.kind === "pinadd"){
      if(!pointer.moved){                    // defect mode step 1: chose the location pin
        pendingLocId = pointer.id; substate = "placePin"; updateTools();
        flash("Now tap the map to drop the defect pin");
      }
    } else if(pointer.kind === "place"){
      if(!pointer.moved) placeDefectAt(e);   // defect mode step 2: pin placed → form opens
    } else if(pointer.kind === "pan"){
      if(!pointer.moved){
        if(mode === "addloc") addLocationAt(e);
        else if(mode === "adddef") flash("Tap a location pin to start");
        else selectLoc(null);                // browse: tap empty closes inspector
      }
    }
    pointer = null;
  });
  viewer.addEventListener("pointercancel", e => {
    pointers.delete(e.pointerId);
    if(pointers.size < 2) pinch = null;
    pointer = null; viewer.classList.remove("panning");
  });
  const clampPct = v => Math.max(1, Math.min(99, v));

  function addLocationAt(e){
    const r = stage.getBoundingClientRect();
    const x = clampPct((e.clientX - r.left)/r.width*100);
    const y = clampPct((e.clientY - r.top)/r.height*100);
    const loc = { id: nextId++, name:"New location", x, y, defects:[] };
    locations.push(loc); save();
    renderPins();
    setMode("browse");                        // one add, then back to browse
    selectLoc(loc.id, true);                  // open inspector with the name field focused
    flash("Location added — name it on the right");
  }

  function placeDefectAt(e){
    const loc = locations.find(l => l.id === pendingLocId);
    if(!loc){ setMode("browse"); return; }
    const r = stage.getBoundingClientRect();
    const coords = { x: clampPct((e.clientX - r.left)/r.width*100), y: clampPct((e.clientY - r.top)/r.height*100) };
    mode = "browse"; substate = "pickLocation"; pendingLocId = null; updateTools();  // leave add mode, keep the open form
    openAddDefect(loc, coords);               // pin placed → now show the form
  }

  // shared by the toolbar flow and the details-panel "Add defect" button
  function beginDefectPlacement(locId){
    mode = "adddef"; substate = "placePin"; pendingLocId = locId;
    updateTools();
    selectLoc(null);                          // close the details panel/sheet so the plan is tappable
    flash("Tap the map to drop the defect pin");
  }

  // ── pins ──
  function worstStatus(loc){
    if(!loc.defects.length) return "loc";
    if(loc.defects.some(d => d.status==="open")) return "open";
    if(loc.defects.some(d => d.status==="progress")) return "progress";
    return "resolved";
  }
  const COLORS = { loc:"#533afd", open:"#ea2261", progress:"#9b6829", resolved:"#15be53" };
  function renderPins(){
    stage.querySelectorAll(".pin, .dpin").forEach(n => n.remove());
    locations.forEach(loc => {
      const el = document.createElement("div");
      el.className = "pin" + (loc.id===selectedId ? " selected":"");
      el.dataset.id = loc.id;
      el.style.left = loc.x + "%"; el.style.top = loc.y + "%";
      const count = loc.defects.length;
      el.innerHTML = `<div class="mark">${SVG_PIN(COLORS.loc)}${count?`<span class="count">${count}</span>`:""}</div><div class="tag">${escapeHtml(loc.name)}</div>`;
      stage.appendChild(el);
      // defect dots, status-coloured, at their own placed coordinate
      loc.defects.forEach(d => {
        if(typeof d.x !== "number") return;
        const dp = document.createElement("div");
        dp.className = "dpin" + (d.id===selectedDefId ? " sel":"");
        dp.dataset.loc = loc.id; dp.dataset.did = d.id;
        dp.style.left = d.x + "%"; dp.style.top = d.y + "%";
        dp.innerHTML = `<div class="ddot" style="background:${COLORS[d.status] || COLORS.open}"></div><div class="tag">${escapeHtml(d.title)}</div>`;
        stage.appendChild(dp);
      });
    });
  }
  function positionPin(id){
    const loc = locations.find(l => l.id===id);
    const el = stage.querySelector(`.pin[data-id="${id}"]`);
    if(el){ el.style.left = loc.x+"%"; el.style.top = loc.y+"%"; }
  }
  function positionDefect(did){
    const el = stage.querySelector(`.dpin[data-did="${did}"]`);
    if(!el) return;
    for(const loc of locations){ const d = loc.defects.find(x => x.id===did); if(d){ el.style.left = d.x+"%"; el.style.top = d.y+"%"; return; } }
  }

  // ── tools / modes ──
  function updateTools(){
    document.querySelectorAll('.fp-tools [data-tool]').forEach(b => {
      if(["browse","addloc","adddef","move"].includes(b.dataset.tool)) b.classList.toggle("on", b.dataset.tool === mode);
    });
    viewer.style.cursor = (mode==="addloc"||mode==="adddef") ? "crosshair" : "grab";
    viewer.classList.toggle("move-mode", mode === "move");
    const chip = $("#modeChip");
    if(mode === "addloc"){ chip.classList.add("show"); $("#modeChipText").textContent = "Add location — tap the plan"; }
    else if(mode === "adddef"){ chip.classList.add("show");
      $("#modeChipText").textContent = substate === "placePin" ? "Now tap the map to drop the defect pin" : "Add defect — tap a location pin"; }
    else if(mode === "move"){ chip.classList.add("show"); $("#modeChipText").textContent = "Move mode — drag pins & defects to reposition"; }
    else chip.classList.remove("show");
  }
  function setMode(m){ mode = m; substate = "pickLocation"; pendingLocId = null; updateTools(); renderInspector(); }

  document.querySelectorAll('.fp-tools [data-tool]').forEach(b => b.onclick = () => {
    const t = b.dataset.tool;

      closeSearch();
      setMode(t);
      if(t === "addloc") flash("Tap anywhere on the plan to drop a location");
      if(t === "adddef") flash("Tap a location pin to add a defect");
      if(t === "move") flash("Drag any pin or defect to reposition it");
    } else if(t === "hide"){
      pinsHidden = !pinsHidden;

      b.classList.toggle("on", pinsHidden);
      $("#eyeIcon").innerHTML = pinsHidden
        ? '<path d="M3 3l18 18M10.6 10.7a3 3 0 0 0 4 4M9.4 5.2A9.6 9.6 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.8M6.2 6.3A17 17 0 0 0 2 12s4 7 10 7a9.7 9.7 0 0 0 3-.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>'
        : '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/>';

    } else if(t === "search"){
      toggleSearch();
    }
  });

  // ── search ──
  const searchPanel = $("#fpSearch"), searchInp = $("#searchInp");
  function toggleSearch(){
    const on = !searchPanel.classList.contains("show");
    searchPanel.classList.toggle("show", on);
    document.querySelector('[data-tool="search"]').classList.toggle("on", on);
    if(on){ searchInp.value = ""; renderResults(); searchInp.focus(); }
  }
  function closeSearch(){ searchPanel.classList.remove("show"); document.querySelector('[data-tool="search"]').classList.remove("on"); }
  function renderResults(){
    const q = (searchInp.value||"").toLowerCase();
    const list = locations.filter(l => l.name.toLowerCase().includes(q));
    const box = $("#sResults");
    if(!list.length){ box.innerHTML = '<div class="sempty">No matching locations</div>'; return; }
    box.innerHTML = list.map(l => {
      const color = COLORS[worstStatus(l)];
      return `<div class="sresult" data-id="${l.id}"><span class="sw" style="background:${color}"></span><span class="nm">${escapeHtml(l.name)}</span><span class="ct">${l.defects.length||""} ${l.defects.length?"defect"+(l.defects.length>1?"s":""):""}</span></div>`;

    });
  }

  searchInp.addEventListener("keydown", e => {

    if(e.key === "Escape") closeSearch();
  });

  // ── inspector ──
  function selectLoc(id, focusName){
    selectedId = id; selectedDefId = null;

  function renderInspector(focusName){
    const loc = locations.find(l => l.id===selectedId);
    document.querySelector(".inspector").classList.toggle("open", !!loc);  // slide the bottom sheet up on tablet/mobile
    const kick = $("#inspKicker"), title = $("#inspTitle"), body = $("#inspBody");
    if(!loc){
      kick.textContent = mode==="addloc" ? "Add location" : mode==="adddef" ? "Add defect" : mode==="move" ? "Move" : "Browse";
      title.textContent = mode==="addloc" ? "Tap the plan to drop a marker"
                        : mode==="adddef" ? "Tap a pin to log a defect"
                        : mode==="move" ? "Drag to reposition"
                        : "Select a location";
      body.innerHTML = `<div class="insp-empty">
        <svg viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="10" r="2.2" fill="currentColor"/></svg>
        <p>${mode==="addloc" ? "Place a marker for a room or area, then name it. You'll return to browse after each one."
          : mode==="adddef" ? "Pick the location pin where the issue is — the defect form opens right here."
          : mode==="move" ? "Drag any location pin or defect dot to a new spot on the plan. Changes save automatically — switch back to Browse when you're done."
          : "Tap any pin to view its defects, or tap a defect dot for its detail. Use the tools on the right to add locations/defects or switch to Move mode to reposition them."}</p></div>`;
      return;
    }

    // single-defect detail view (clicking a defect dot or a defect card)
    if(selectedDefId != null){
      const d = loc.defects.find(x => x.id === selectedDefId);
      if(d){
        const map = { open:["badge-open","Open"], progress:["badge-progress","In progress"], resolved:["badge-resolved","Resolved"] };
        const [cls,label] = map[d.status] || map.open;
        kick.textContent = "Defect";

        body.innerHTML = `
          <button class="btn btn-neutral btn-sm" id="backLoc" style="margin-bottom:var(--space-4)">
            <svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            ${escapeHtml(loc.name)}</button>
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:var(--space-4)">
            <span class="badge ${cls}"><span class="dot"></span>${label}</span>
            <span class="muted tnum" style="font-size:var(--text-xs)">${escapeHtml(d.date)}</span>
          </div>
          <p style="font-size:var(--text-sm);color:var(--fg-2);margin:0 0 var(--space-4)">${escapeHtml(d.desc)}</p>
          ${d.photo?`<img src="${d.photo}" alt="defect photo" style="width:100%;border-radius:var(--radius-md);border:1px solid var(--border);margin-bottom:var(--space-4)">`:""}
          <div class="field"><label>Status</label>
            <select id="defStatus">
              <option value="open"${d.status==="open"?" selected":""}>Open</option>
              <option value="progress"${d.status==="progress"?" selected":""}>In progress</option>
              <option value="resolved"${d.status==="resolved"?" selected":""}>Resolved</option>
            </select></div>
          <button class="btn btn-danger btn-sm" id="delDef">Remove defect</button>
          <p class="muted" style="font-size:var(--text-xs);margin-top:var(--space-3)">Tip: switch to Move mode (toolbar) to drag this defect to a new spot.</p>`;
        $("#backLoc").onclick = () => selectLoc(loc.id);
        $("#defStatus").onchange = () => { d.status = $("#defStatus").value; save(); renderPins(); renderInspector(); };
        $("#delDef").onclick = () => { loc.defects = loc.defects.filter(x => x.id!==d.id); selectedDefId = null; save(); selectLoc(loc.id); };
        return;
      }
      selectedDefId = null;   // defect no longer exists → fall back to location view
    }

    kick.textContent = "Location";
    title.textContent = loc.name;
    const counts = { open:0, progress:0, resolved:0 };
    loc.defects.forEach(d => counts[d.status]++);
    let html = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--space-4)">

      ${counts.progress?`<span class="badge badge-progress"><span class="dot"></span>${counts.progress} in progress</span>`:""}
      ${counts.resolved?`<span class="badge badge-resolved"><span class="dot"></span>${counts.resolved} resolved</span>`:""}
      ${loc.defects.length?"":'<span class="muted" style="font-size:var(--text-sm)">No defects logged yet.</span>'}
    </div>`;

    html += `<div class="field"><label>Location name</label>
      <div class="loc-rename"><input id="renameInp" value="${escapeAttr(loc.name)}" placeholder="e.g. Conference Room"></div></div>`;
    html += loc.defects.map(d => defectCard(d)).join("");
    html += `<div style="display:flex;gap:8px;margin-top:var(--space-2)">
      <button class="btn btn-primary btn-sm" id="addDefBtn">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Add defect</button>
      <button class="btn btn-danger btn-sm" id="delLoc">Remove location</button></div>`;
    body.innerHTML = html;

    const inp = $("#renameInp");

    if(focusName){ inp.focus(); inp.select(); }

    $("#addDefBtn").onclick = () => beginDefectPlacement(loc.id);
    body.querySelectorAll(".defect[data-did]").forEach(card => card.onclick = e => {

    body.querySelectorAll(".statussel").forEach(sel => sel.onchange = () => {
      const d = loc.defects.find(x => x.id === +sel.dataset.did);
      d.status = sel.value; save(); renderPins(); renderInspector();
    });
  }

  function defectCard(d){
    return `<div class="defect" data-did="${d.id}">

      <p>${escapeHtml(d.desc)}</p>
      ${d.photo?`<img class="shot" src="${d.photo}" alt="defect photo">`:""}
      <div class="d-foot">
        <select class="statussel" data-did="${d.id}">
          <option value="open"${d.status==="open"?" selected":""}>Open</option>
          <option value="progress"${d.status==="progress"?" selected":""}>In progress</option>
          <option value="resolved"${d.status==="resolved"?" selected":""}>Resolved</option>
        </select>
        <span class="date tnum">${d.date}</span>
      </div></div>`;
  }

  // ── add defect (with dynamic photo attach) ──
  let pendingPhotos = [];
  function openAddDefect(loc, coords){
    pendingPhotos = [];
    const defCoords = coords || { x: clampPct(loc.x + 2.5), y: clampPct(loc.y + 2.5) };  // inspector button: auto-offset near the location
    selectLoc(loc.id);   // make sure inspector shows this location
    const body = $("#inspBody");
    body.insertAdjacentHTML("afterbegin", `
      <div class="card card-pad" id="newDefect" style="margin-bottom:var(--space-4);border-color:#b9b9f9">
        <div class="eyebrow" style="margin-bottom:var(--space-3)">New defect · ${escapeHtml(loc.name)}</div>
        <div class="field"><label>Issue title</label><input id="ndTitle" placeholder="e.g. Sink not working"></div>
        <div class="field"><label>Description / comment</label><textarea id="ndDesc" placeholder="What's wrong, where exactly…"></textarea></div>
        <div class="field"><label>Status</label>
          <select id="ndStatus"><option value="open">Open</option><option value="progress">In progress</option><option value="resolved">Resolved</option></select></div>
        <div class="field"><label>Photo evidence</label>
          <div class="photo-drop" id="ndDrop">
            <svg viewBox="0 0 24 24"><path d="M3 16.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-1.5M12 3v12m0-12 4 4m-4-4-4 4" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Take photo or upload from gallery
          </div>
          <div class="photo-prev" id="ndPrev"></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:var(--space-2)">
          <button class="btn btn-primary btn-sm" id="ndSave">Save defect</button>
          <button class="btn btn-neutral btn-sm" id="ndCancel">Cancel</button>
        </div>
      </div>`);
    $("#ndTitle").focus();
    $("#ndDrop").onclick = () => $("#photoFile").click();
    $("#ndCancel").onclick = () => renderInspector();
    $("#ndSave").onclick = () => {
      const t = $("#ndTitle").value.trim();
      if(!t){ $("#ndTitle").focus(); flash("Add an issue title first"); return; }
      loc.defects.push({ id: nextId++, title:t, desc:$("#ndDesc").value.trim() || "—",
        status:$("#ndStatus").value, date: new Date().toISOString().slice(0,10),
        x: defCoords.x, y: defCoords.y, photo: pendingPhotos[0] || null });
      save(); renderPins(); renderInspector(); flash("Defect saved");
    };
  }

  // ── bottom-sheet close (tablet / mobile) ──
  $("#inspClose").onclick = () => selectLoc(null);

  // ── plan switcher dropdown ──
  (function planSwitcher(){
    const btn = $("#planSwitch"), menu = $("#planMenu");
    const rows = plansList.map(p => {
      const c = FP.counts(p.id);
      return `<button class="pm-item${p.id===planId?' active':''}" data-id="${p.id}">
        <img src="${p.img}" alt=""><span><span class="nm">${escapeHtml(p.name)}</span><br><span class="mt">${c.locations} loc · ${c.open} open</span></span></button>`;
    }).join("");
    menu.innerHTML = rows + `<div class="pm-foot"><a href="plans.html">All floor plans</a><a href="plans.html#add">+ Add plan</a></div>`;
    menu.querySelectorAll(".pm-item").forEach(it => it.onclick = () => {
      const id = it.dataset.id;
      if(id === planId){ menu.classList.remove("show"); return; }
      FP.setLastPlan(id); location.href = "floorplan.html?plan=" + encodeURIComponent(id);
    });
    btn.onclick = e => { e.stopPropagation(); menu.classList.toggle("show"); };
    document.addEventListener("click", e => { if(!menu.contains(e.target) && !btn.contains(e.target)) menu.classList.remove("show"); });
  })();

  // ── file inputs ──
  $("#replaceBtn").onclick = () => $("#planFile").click();
  $("#planFile").onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      plan.img = reader.result; FP.savePlans(plansList);     // persist so the swap survives navigation/reload
      planImg.onload = () => { renderPins(); fit(); };
      planImg.src = plan.img;
      flash("Floor plan replaced");
    };
    reader.readAsDataURL(f);
  };
  $("#photoFile").onchange = e => {
    const files = [...e.target.files]; if(!files.length) return;
    files.forEach(f => pendingPhotos.push(URL.createObjectURL(f)));
    const prev = $("#ndPrev");
    if(prev) prev.innerHTML = pendingPhotos.map(u => `<img src="${u}" alt="">`).join("");
    e.target.value = "";
  };

  // ── hint toast ──
  let hintT;
  function flash(msg){
    const h = $("#hint"); h.textContent = msg; h.classList.add("show");
    clearTimeout(hintT); hintT = setTimeout(() => h.classList.remove("show"), 1800);
  }

  // ── helpers ──
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  // ── boot ──
  function boot(){ renderPins(); fit(); updateTools(); renderInspector(); }
  planImg.onload = boot;
  planImg.src = plan.img;                       // load the active plan's image
  if(planImg.complete && planImg.naturalWidth) boot();

  // tiny self-check (logs only on failure)
  (function selfCheck(){
    console.assert(worstStatus({defects:[{status:"resolved"},{status:"open"}]})==="open", "open should win");
    console.assert(worstStatus({defects:[]})==="loc", "empty → loc");
    console.assert(clampPct(120)===99 && clampPct(-5)===1, "clampPct bounds");
  })();
})();
</script>
</body>
</html>
