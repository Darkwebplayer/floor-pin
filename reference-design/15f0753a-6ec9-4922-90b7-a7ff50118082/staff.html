<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FloorPin — Staff</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  .staff-grid { display: grid; grid-template-columns: 1fr 360px; gap: var(--space-6); align-items: start; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 var(--space-4) var(--space-3); border-bottom: 1px solid var(--border); }
  td { padding: var(--space-4); border-bottom: 1px solid var(--border); font-size: var(--text-sm); color: var(--fg-2); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .person { display: flex; align-items: center; gap: var(--space-3); }
  .person .nm { color: var(--fg); }
  .person .em { color: var(--muted); font-size: var(--text-xs); }
  .rolesel { font-size: var(--text-xs); padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; color: var(--fg-2); min-height: 32px; }
  .x { color: var(--muted); border: none; background: none; cursor: pointer; padding: 6px; border-radius: var(--radius-sm); }
  .x:hover { color: var(--danger); background: color-mix(in oklab,var(--danger),transparent 92%); }
  .invite .field:last-of-type { margin-bottom: var(--space-3); }
  .seat { display:flex; justify-content:space-between; font-size: var(--text-sm); padding: 10px 0; border-bottom: 1px solid var(--border); }
  .seat:last-child{ border-bottom:none; }
  @media (max-width: 980px){ .staff-grid{ grid-template-columns: 1fr; } }
  @media (max-width: 600px){
    .section-head{ flex-direction: column; align-items: stretch; gap: var(--space-3); }
    .section-head input{ max-width: none !important; }
    th, td{ padding-left: 0; padding-right: var(--space-2); }
    td{ padding-top: var(--space-3); padding-bottom: var(--space-3); }
    td:last-child, th:last-child{ padding-right: 0; }
    .person{ gap: var(--space-2); }
    .person .em{ max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rolesel{ min-height: 36px; }
  }
</style>
</head>
<body data-page="staff">
<div class="app" data-shell>
  <main class="main">
    <header class="topbar">
      <div><div class="crumb">Workspace · <b>Northbridge FM</b></div><div class="title">Staff management</div></div>
    </header>
    <div class="content">
      <div class="staff-grid">
        <div class="card card-pad">
          <div class="section-head">
            <h2 style="font-size:var(--text-xl)">Team directory <span class="muted tnum" id="count" style="font-size:var(--text-base)"></span></h2>
            <input class="field" style="margin:0;max-width:220px" id="search" placeholder="Search name or email">
          </div>
          <table>
            <thead><tr><th>Member</th><th>Role</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>

        <div>
          <div class="card card-pad invite" style="margin-bottom:var(--space-6)">
            <span class="eyebrow">Invite</span>
            <h2 style="font-size:var(--text-xl);margin:6px 0 var(--space-4)">Add a staff member</h2>
            <form id="inviteForm">
              <div class="field"><label>Email address</label><input id="email" type="email" placeholder="name@company.com" required></div>
              <div class="field"><label>Role</label>
                <select id="role"><option value="Staff">Staff</option><option value="Manager">Manager</option></select></div>
              <button class="btn btn-primary" style="width:100%" type="submit">Send invite</button>
              <p class="muted" style="font-size:var(--text-xs);margin:var(--space-3) 0 0">They'll get a Google Sign-In link scoped to assigned projects.</p>
            </form>
          </div>
          <div class="card card-pad">
            <span class="eyebrow">Access</span>
            <h2 style="font-size:var(--text-xl);margin:6px 0 var(--space-3)">Seats &amp; access</h2>
            <div class="seat"><span class="muted">Active members</span><b class="tnum" id="seatActive">—</b></div>
            <div class="seat"><span class="muted">Admin</span><b class="tnum" id="seatAdmin">—</b></div>
            <div class="seat"><span class="muted">Managers</span><b class="tnum" id="seatMgr">—</b></div>
            <div class="seat"><span class="muted">Pending invites</span><b class="tnum" id="seatPending">1</b></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="assets/shell.js"></script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const ROLES = ["Admin","Manager","Staff"];
  let staff = [
    { name:"Aisha Malik", email:"aisha@northbridge.fm", role:"Admin", projects:3 },
    { name:"Daniel Okafor", email:"daniel.okafor@northbridge.fm", role:"Manager", projects:3 },
    { name:"Priya Nair", email:"priya.nair@northbridge.fm", role:"Staff", projects:2 },
    { name:"Tom Halvorsen", email:"tom.h@northbridge.fm", role:"Staff", projects:1 },
    { name:"Site Client", email:"client@lakeside-dev.com", role:"Staff", projects:1 },
  ];
  const initials = n => n.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
  const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function render(){
    const q = ($("#search").value||"").toLowerCase();
    const list = staff.filter(p => (p.name+p.email).toLowerCase().includes(q));
    $("#rows").innerHTML = list.map((p,i) => `
      <tr>
        <td><div class="person"><span class="avatar">${initials(p.name)}</span>
          <span><div class="nm">${esc(p.name)}</div><div class="em">${esc(p.email)}</div></span></div></td>
        <td><select class="rolesel" data-i="${staff.indexOf(p)}">
          ${ROLES.map(r=>`<option${r===p.role?" selected":""}>${r}</option>`).join("")}
        </select></td>
        <td style="text-align:right"><button class="x" data-del="${staff.indexOf(p)}" title="Remove">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button></td>
      </tr>`).join("");
    $("#count").textContent = `· ${staff.length}`;
    $("#seatActive").textContent = staff.length;
    $("#seatAdmin").textContent = staff.filter(p=>p.role==="Admin").length;
    $("#seatMgr").textContent = staff.filter(p=>p.role==="Manager").length;
    $("#rows").querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      const idx = +b.dataset.del;
      if(staff[idx].role==="Admin"){ alert("Assign the Admin role to another member before removing the current admin."); return; }
      staff.splice(idx,1); render();
    });
    $("#rows").querySelectorAll(".rolesel").forEach(s => s.onchange = () => {
      const i = +s.dataset.i;
      if(s.value==="Admin"){
        // only one admin — demote the previous one
        staff.forEach((p,j) => { if(p.role==="Admin" && j!==i) p.role = "Manager"; });
      }
      staff[i].role = s.value; render();
    });
  }
  $("#search").oninput = render;
  $("#inviteForm").onsubmit = e => {
    e.preventDefault();
    const email = $("#email").value.trim();
    const name = email.split("@")[0].replace(/[._]/g," ").replace(/\b\w/g,c=>c.toUpperCase());
    staff.unshift({ name, email, role:$("#role").value, projects:0 });
    $("#email").value = ""; render();
  };
  render();
})();
</script>
</body>
</html>
