name: Release APK

# Deploy a new version: push a tag like `v1.2.0`.
#   git tag v1.2.0 && git push origin v1.2.0
# workflow_dispatch builds a signed APK artifact without cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # AGP 9.x requires JDK 17+; 21 is the current LTS

      - uses: gradle/actions/setup-gradle@v4 # gradle caching + wrapper validation

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }} # tag name, e.g. v1.2.0 (build strips the 'v')
          VERSION_CODE: ${{ github.run_number }} # monotonic, unique per run
        run: ./gradlew :androidApp:assembleRelease

      - name: Locate APK and compute SHA-256
        id: apk
        run: |
          set -euo pipefail
          APK=$(find androidApp/build/outputs/apk/release -name '*.apk' | head -n1)
          OUT="floorpin-${{ github.ref_name }}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: floorpin-apk
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
          generate_release_notes: true
          body: |
            Verify the download:
            ```
            sha256sum -c ${{ steps.apk.outputs.name }}.sha256
            ```
